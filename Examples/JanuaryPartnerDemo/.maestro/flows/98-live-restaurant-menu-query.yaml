appId: ai.january.partner.demo
name: Live restaurant menu dish search, no matches, and full-menu reset
tags:
  - live
---
- runFlow: ../live-bootstrap.yaml
- tapOn:
    id: search-scope-restaurants
- tapOn:
    id: restaurant-search-input
- inputText: sweetgreen
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: restaurant-result-0
    timeout: 45000
- waitForAnimationToEnd
- tapOn:
    id: restaurant-result-0
- extendedWaitUntil:
    visible:
      id: restaurant-menu-item-0
    timeout: 60000
- assertNotVisible:
    id: menu-error
- tapOn:
    id: restaurant-menu-search
- inputText: CHICKEN
- pressKey: Enter
- tapOn:
    id: restaurant-menu-search-submit
- extendedWaitUntil:
    visible:
      id: restaurant-menu-item-0
    timeout: 60000
- assertVisible: "(?i).*chicken.*"
- tapOn:
    id: restaurant-menu-item-0
- extendedWaitUntil:
    visible:
      id: menu-item-detail-screen
    timeout: 15000
- assertVisible: "(?i).*chicken.*"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: menu-glucose-button
- assertVisible:
    id: menu-glucose-button
- tapOn:
    text: Back
- extendedWaitUntil:
    visible:
      id: restaurant-detail-screen
    timeout: 15000
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: restaurant-menu-search
- assertVisible: CHICKEN
- assertVisible:
    id: restaurant-menu-item-0
- tapOn:
    id: restaurant-menu-search
- eraseText: 32
- inputText: jan159-no-such-dish
- pressKey: Enter
- tapOn:
    id: restaurant-menu-search-submit
- extendedWaitUntil:
    visible:
      id: menu-empty
    timeout: 60000
- tapOn:
    id: restaurant-menu-search-clear
- extendedWaitUntil:
    visible:
      id: restaurant-menu-item-0
    timeout: 60000
- assertNotVisible:
    id: menu-error

appId: ai.january.partner.demo
name: Food logs browse and create
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-food-logs
    timeout: 15000
- runScript:
    file: ../scripts/seed-fixture.js
- tapOn:
    id: tab-food-logs
# The list sits below the user and create cards; rows offscreen are not in the hierarchy.
- scrollUntilVisible:
    element:
      id: food-log-0
    direction: DOWN
    timeout: 30000
- tapOn:
    id: food-log-0
- assertVisible:
    id: food-log-detail
- assertVisible: Fixture oatmeal
# The system back button carries the previous screen's title; the tab bar shows it too, lower down.
- tapOn:
    text: Logs
    index: 0
- extendedWaitUntil:
    visible:
      id: food-log-add
    timeout: 15000
- tapOn:
    id: food-log-add
- assertVisible: New food log
- tapOn:
    id: food-log-name
- inputText: Afternoon snack
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: food-log-add-food
    direction: DOWN
- tapOn:
    id: food-log-add-food
- assertVisible:
    id: food-picker
- tapOn:
    id: food-picker-input
- inputText: oatmeal
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: food-picker-result-0
    timeout: 15000
- tapOn:
    id: food-picker-result-0
- assertVisible:
    id: food-serving-sheet
- tapOn:
    id: food-serving-add
- scrollUntilVisible:
    element:
      id: food-log-save
    direction: DOWN
- tapOn:
    id: food-log-save
# The meals list sits below the day's water and weight cards.
- scrollUntilVisible:
    element:
      text: .*Afternoon snack.*
    direction: DOWN
    timeout: 30000

appId: ai.january.partner.demo
name: Restaurant menu loading, empty, failure, retry, and a menu item's glucose impact
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 15000
- tapOn:
    id: search-scope-restaurants
- tapOn:
    id: restaurant-search-input
- inputText: Fixture Cafe
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: restaurant-result-0
    timeout: 15000
# A slow menu shows its loading row, then the items.
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/restaurants/cafe/menu-items
      DELAY: "8"
- tapOn:
    id: restaurant-result-0
- extendedWaitUntil:
    visible:
      id: menu-loading
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: menu-results
    timeout: 15000
- tapOn:
    text: Search
- extendedWaitUntil:
    visible:
      id: restaurant-result-0
    timeout: 15000
# A restaurant without menu items.
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/restaurants/cafe/menu-items
      EMPTY: "true"
- tapOn:
    id: restaurant-result-0
- extendedWaitUntil:
    visible:
      id: menu-empty
    timeout: 15000
- assertVisible: No menu items found
- tapOn:
    text: Search
- extendedWaitUntil:
    visible:
      id: restaurant-result-0
    timeout: 15000
# A failed menu recovers on retry.
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/restaurants/cafe/menu-items
      STATUS: "500"
- tapOn:
    id: restaurant-result-0
- extendedWaitUntil:
    visible:
      id: menu-error
    timeout: 15000
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/restaurants/cafe/menu-items
      STATUS: "200"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: menu-error-retry
- tapOn:
    id: menu-error-retry
- extendedWaitUntil:
    visible:
      id: menu-results
    timeout: 15000
# A menu item's glucose impact.
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: restaurant-menu-item-0
- tapOn:
    id: restaurant-menu-item-0
- extendedWaitUntil:
    visible:
      id: menu-item-detail-screen
    timeout: 15000
- assertVisible: Fixture bowl
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: menu-glucose-button
- tapOn:
    id: menu-glucose-button
- extendedWaitUntil:
    visible:
      id: food-glucose-result
    timeout: 15000
- assertVisible: Medium impact
- runScript:
    file: ../scripts/assert-request.js
    env:
      ROUTE: /v1.2/glucose/predictions

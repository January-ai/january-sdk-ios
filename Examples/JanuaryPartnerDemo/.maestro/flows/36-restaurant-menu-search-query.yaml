appId: ai.january.partner.demo
name: Search a selected restaurant menu and clear the filter
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: search-scope-restaurants
    timeout: 15000
- tapOn:
    id: search-scope-restaurants
- tapOn:
    id: restaurant-search-input
- inputText: Fixture Cafe
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: restaurant-result-0
    timeout: 15000
- tapOn:
    id: restaurant-result-0
- extendedWaitUntil:
    visible:
      id: restaurant-menu-search
    timeout: 15000
- tapOn:
    id: restaurant-menu-search
- inputText: bowl
- hideKeyboard
- tapOn:
    id: restaurant-menu-search-submit
- extendedWaitUntil:
    visible:
      id: restaurant-menu-item-0
    timeout: 15000
- tapOn:
    id: restaurant-menu-search-clear
- extendedWaitUntil:
    visible:
      id: restaurant-menu-item-0
    timeout: 15000

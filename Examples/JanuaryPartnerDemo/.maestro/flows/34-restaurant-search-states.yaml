appId: ai.january.partner.demo
name: Restaurant search filters, loading, empty, failure, and retry
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 15000
- tapOn:
    id: search-scope-restaurants
- assertVisible:
    id: restaurants-initial
- tapOn:
    id: restaurant-mode-menu
- assertVisible: Dish or restaurant
- tapOn:
    id: restaurant-mode-restaurants
- assertVisible: Restaurant name
# Filters close with the close button or apply.
- tapOn:
    id: restaurant-filters-button
- assertVisible:
    id: restaurant-filters
- tapOn:
    id: restaurant-filters-close
- assertNotVisible:
    id: restaurant-filters
- tapOn:
    id: restaurant-filters-button
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: restaurant-filters-apply
- tapOn:
    id: restaurant-filters-apply
- assertNotVisible:
    id: restaurant-filters
# Loading, then results.
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/restaurants
      DELAY: "8"
- tapOn:
    id: restaurant-search-input
- inputText: Fixture Cafe
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: restaurants-loading
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: restaurant-result-0
    timeout: 15000
- assertVisible: Fixture Cafe
# No matches.
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/restaurants
      EMPTY: "true"
- tapOn:
    id: restaurant-search-clear
- tapOn:
    id: restaurant-search-input
- inputText: Nowhere Diner
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: restaurants-empty
    timeout: 15000
- assertVisible: No nearby matches
# A failure keeps the query and recovers on retry.
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/restaurants
      STATUS: "500"
- tapOn:
    id: restaurant-search-submit
- extendedWaitUntil:
    visible:
      id: restaurants-error
    timeout: 15000
- assertVisible: Nowhere Diner
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/restaurants
      STATUS: "200"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: restaurants-error-retry
- tapOn:
    id: restaurants-error-retry
- extendedWaitUntil:
    visible:
      id: restaurant-result-0
    timeout: 15000
- assertNotVisible:
    id: restaurants-error
# Menu item search reports no matches the same way.
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/menu-items
      EMPTY: "true"
- tapOn:
    id: restaurant-mode-menu
- tapOn:
    id: restaurant-search-submit
- extendedWaitUntil:
    visible:
      id: restaurants-empty
    timeout: 15000

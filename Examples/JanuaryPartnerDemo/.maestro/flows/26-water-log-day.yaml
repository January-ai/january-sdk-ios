appId: ai.january.partner.demo
name: Tracking day view water create total and delete
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-tracking
    timeout: 15000
- tapOn:
    id: tab-tracking
- assertVisible:
    id: logs-day-picker
- assertVisible: Today
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-total
- assertVisible: No water logged
# With the water total in view, the log button sits just below it. Centering
# the button itself can scroll it under the navigation bar now that the trend
# chart follows it in the card.
- scrollUntilVisible:
    element:
      id: water-log-create
    direction: DOWN
- tapOn:
    id: water-log-create
# The water total and delete button sit above the centered log button.
- extendedWaitUntil:
    visible: 8 fl oz
    timeout: 15000
# Another day never shows this day's total or offers to delete its log, even
# when that day's water cannot be loaded.
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/water-logs
      STATUS: "500"
- scrollUntilVisible:
    element:
      id: logs-day-previous
    direction: UP
    centerElement: true
- tapOn:
    id: logs-day-previous
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-error
# The card's total is for the day shown; the week chart still includes today.
- assertVisible:
    id: water-total
    text: Water total unavailable
- assertNotVisible:
    id: water-log-delete
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/water-logs
      STATUS: "200"
- scrollUntilVisible:
    element:
      id: logs-day-today
    direction: UP
    centerElement: true
- tapOn:
    id: logs-day-today
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-total
- extendedWaitUntil:
    visible: 8 fl oz
    timeout: 15000
- scrollUntilVisible:
    element:
      id: water-log-delete
    direction: UP
- takeScreenshot: Examples/JanuaryPartnerDemo/.maestro/artifacts/ios-logs-water
- tapOn:
    id: water-log-delete
- extendedWaitUntil:
    visible: No water logged
    timeout: 15000
- assertNotVisible:
    id: water-log-delete

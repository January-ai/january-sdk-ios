appId: ai.january.partner.demo
name: Tracking day view water create total and delete
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-tracking
    timeout: 15000
- tapOn:
    id: tab-tracking
- assertVisible:
    id: logs-day-picker
- assertVisible: Today
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-total
- assertVisible: No water logged
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-log-create
- tapOn:
    id: water-log-create
# The water total and delete button sit above the centered log button.
- extendedWaitUntil:
    visible: 8 fl oz
    timeout: 15000
- scrollUntilVisible:
    element:
      id: water-log-delete
    direction: UP
- takeScreenshot: Examples/JanuaryPartnerDemo/.maestro/artifacts/ios-logs-water
- tapOn:
    id: water-log-delete
- extendedWaitUntil:
    visible: No water logged
    timeout: 15000
- assertNotVisible:
    id: water-log-delete
